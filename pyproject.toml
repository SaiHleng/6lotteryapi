[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trx-virtual-telegram-bot"
version = "1.1.0"
description = "Virtual-only TRX-style fixed-bet Telegram simulator (no live betting)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Project Maintainers" }
]
dependencies = [
    "python-telegram-bot>=21.0,<23.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools]
py-modules = ["bot", "engine", "authorized_api_template"]

[tool.pytest.ini_options]
testpaths = ["tests"]
